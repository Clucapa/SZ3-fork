name: Build

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  check-non-ascii:
    name: Check non-ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for non-ASCII characters in C/C++ files
        run: |
          EXTENSIONS="*.h *.hpp *.c *.cpp *.cxx *.hxx"

          if git grep -P '[^\x00-\x7F]$' -- $EXTENSIONS; then
            echo "::error::Line ends with non-ASCII character!"
            exit 1
          fi

          has_error=0
          while IFS= read -r line; do
            before_comment="${line%%//*}"
            if echo "$before_comment" | grep -qP '[^\x00-\x7F]'; then
              echo "$line"
              has_error=1
            fi
          done < <(git grep -P '[^\x00-\x7F]' -- $EXTENSIONS || true)

          if [ $has_error -eq 1 ]; then
            echo "::error::Non-ASCII character found before // comment (or in line without //)"
            exit 1
          fi

          echo "No disallowed non-ASCII characters found."

  parse-commit:
    name: Parse commit keywords
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.parse.outputs.run_build }}
      run_test: ${{ steps.parse.outputs.run_test }}
    steps:
      - name: Extract [build] / [test] from commit message
        id: parse
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(echo "$MSG" | tr -d '\n\r')
          BRACKET=$(echo "$MSG" | grep -oP '\[[^\]]*\]\s*$' | sed 's/.*\[\(.*\)\].*/\1/' | xargs)
          run_build=false
          run_test=false
          for word in $BRACKET; do
            case "$word" in
              build) run_build=true ;;
              test)  run_build=true; run_test=true ;;
              *)     echo "::error::Unknown CI keyword: $word"; exit 1 ;;
            esac
          done
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_test=$run_test" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build (Linux)
    needs: [parse-commit]
    if: needs.parse-commit.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_H5Z_FILTER=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run QoI-related tests
        if: needs.parse-commit.outputs.run_test == 'true'
        run: |
          TESTS="test_qpet_qoi test_qpet_eb_provider test_qpet_regional test_qpet_interp"
          all_passed=0
          for t in $TESTS; do
            if ./test/bin/$t; then
              echo "✓ $t passed"
            else
              echo "✗ $t FAILED"
              all_passed=1
            fi
          done
          if [ $all_passed -eq 1 ]; then
            echo "::error::Some QoI tests failed"
            exit 1
          fi
          echo "All QoI tests passed"
