name: Build

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  check-non-ascii:
    name: Check non-ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for non-ASCII characters in C/C++ files
        run: |
          EXTENSIONS="*.h *.hpp *.c *.cpp *.cxx *.hxx"

          if git grep -P '[^\x00-\x7F]$' -- $EXTENSIONS; then
            echo "::error::Line ends with non-ASCII character!"
            exit 1
          fi

          has_error=0
          while IFS= read -r line; do
            before_comment="${line%%//*}"
            if echo "$before_comment" | grep -qP '[^\x00-\x7F]'; then
              echo "$line"
              has_error=1
            fi
          done < <(git grep -P '[^\x00-\x7F]' -- $EXTENSIONS || true)

          if [ $has_error -eq 1 ]; then
            echo "::error::Non-ASCII character found before // comment (or in line without //)"
            exit 1
          fi

          echo "No disallowed non-ASCII characters found."

  parse-commit:
    name: Parse commit keywords
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.parse.outputs.run_build }}
      run_test: ${{ steps.parse.outputs.run_test }}
      run_full: ${{ steps.parse.outputs.run_full }}
      run_compose: ${{ steps.parse.outputs.run_compose }}
    steps:
      - name: Extract [build] / [test] / [full] from commit message
        id: parse
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(echo "$MSG" | tr -d '\n\r')
          BRACKET=$(echo "$MSG" | grep -oP '\[[^\]]*\]\s*$' | sed 's/.*\[\(.*\)\].*/\1/' | xargs)
          run_build=false
          run_test=false
          run_full=false
          run_compose=false
          for word in $BRACKET; do
            case "$word" in
              build)   run_build=true ;;
              test)    run_build=true; run_test=true ;;
              full)    run_build=true; run_test=true; run_full=true ;;
              compose) run_build=true; run_test=true; run_compose=true ;;
              *)       echo "::error::Unknown CI keyword: $word"; exit 1 ;;
            esac
          done
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_test=$run_test" >> "$GITHUB_OUTPUT"
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "run_compose=$run_compose" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build (Linux)
    needs: [parse-commit]
    if: needs.parse-commit.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_H5Z_FILTER=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run e2e tests (fast)
        if: needs.parse-commit.outputs.run_test == 'true' && needs.parse-commit.outputs.run_full != 'true' && needs.parse-commit.outputs.run_compose != 'true'
        run: |
          cd build
          if ctest --output-on-failure; then
            echo "All e2e tests passed"
          else
            echo "::error::End-to-end tests failed"
            exit 1
          fi

      - name: Run e2e tests (compose)
        if: needs.parse-commit.outputs.run_compose == 'true'
        run: |
          cd build
          if ctest -R e2e_compose --output-on-failure; then
            echo "All compose tests passed"
          else
            echo "::error::Compose tests failed"
            exit 1
          fi

      - name: Run e2e tests (full)
        if: needs.parse-commit.outputs.run_full == 'true'
        run: |
          ./test/bin/e2e --full
          if [ $? -ne 0 ]; then
            echo "::error::Full end-to-end tests failed"
            exit 1
          fi
          echo "All full e2e tests passed"
